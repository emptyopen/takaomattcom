name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Public Firebase web config. These NEXT_PUBLIC_* values are inlined into
    # the client bundle at build time and are public by design — the real
    # security boundary is the Firestore rules, not these values. They are
    # therefore safe to keep in the repo. They are read here from repository
    # Variables (Settings -> Secrets and variables -> Actions -> Variables) so
    # the site can be configured without editing this file; if you prefer, you
    # can replace each `${{ vars.NAME }}` with the literal value inline.
    #
    # NOTE: the actual values could not be auto-recovered when this workflow
    # was authored (the live site was unreachable), so populate these repo
    # Variables before the first deploy:
    #   NEXT_PUBLIC_FIREBASE_API_KEY
    #   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    #   NEXT_PUBLIC_FIREBASE_PROJECT_ID          (= takaomatt-4bc1e)
    #   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    #   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    #   NEXT_PUBLIC_FIREBASE_APP_ID
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_API_KEY
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_AUTH_DOMAIN
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_PROJECT_ID
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_STORAGE_BUCKET
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_MESSAGING_SENDER_ID
    #   NEXT_PUBLIC_NEXTBITE_FIREBASE_APP_ID
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_API_KEY }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_NEXTBITE_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_NEXTBITE_FIREBASE_APP_ID }}
      # Admin allowlist — the Firebase Auth UID permitted into /admin. Public
      # (also present in firestore.rules); safe to commit.
      NEXT_PUBLIC_ADMIN_UIDS: h6yAgTDOXxcavDyNA5dqJsvgcVR2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools deploy --only firestore:rules --project takaomatt-4bc1e --non-interactive

      - name: Publish to S3 and invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          # Discover the bucket's region (a location constraint of "None" means
          # the legacy us-east-1 default).
          REGION=$(aws s3api get-bucket-location --bucket takaomatt.com --query 'LocationConstraint' --output text)
          [ "$REGION" = "None" ] && REGION=us-east-1
          echo "Bucket region: $REGION"

          aws s3 sync ./out s3://takaomatt.com --delete --region "$REGION"

          # Discover the CloudFront distribution that serves takaomatt.com.
          DIST=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, 'takaomatt.com')].Id | [0]" --output text)
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "No CloudFront distribution with alias takaomatt.com; skipping invalidation"
          else
            echo "Invalidating CloudFront distribution: $DIST"
            aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
          fi
